version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
          time: "00:00"
          timezone: "Etc/UTC"
      ignore:
          - dependency-name: "@types/node"
            versions: [">=21"]
      cooldown:
          default-days: 1
          include:
              - "*"
